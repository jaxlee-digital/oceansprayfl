- slug: fort-myers
  name: Fort Myers
  county: Lee County
  population: "approximately 95,000 city, 800,000 metro"
  short: "Fort Myers"
  geographic_summary: >-
    Fort Myers is the largest city in Lee County, anchoring
    Southwest Florida's industrial and logistics corridor. The
    Caloosahatchee River bisects the city, with seawalled
    waterfront from downtown through McGregor and out to the Cape
    Coral bridge.
  seawall_context: >-
    Caloosahatchee River walls behave differently than canal walls:
    bigger water body, larger wave fetch, more boat-wake fatigue, and
    a daily freshwater-saltwater interface that accelerates soil
    chemistry changes behind the wall. McGregor Boulevard waterfront
    walls and downtown river walls are the highest-value, oldest
    inventory. Newer walls along the south bank and into Iona/
    St. James City show more typical coastal failure modes.
  hurricane_context: >-
    Fort Myers Beach took the worst of Hurricane Ian's surge in 2022.
    Mainland Fort Myers walls along the river were protected from
    direct surge by the island and the river bend, but inland flooding
    soaked fill behind walls and is still producing delayed settlement.
  warehouse_context: >-
    Fort Myers anchors the Southwest Florida industrial corridor.
    The Metro Parkway, Hanson Street, Daniels Parkway, and Alico
    Road areas hold the largest concentration of warehouse,
    distribution, light manufacturing, and dock-equipped commercial
    space in the region. Most slabs date to the 1985-2015 build-out
    on sandy fill, with classic settlement at dock thresholds, around
    column footings, and along forklift lanes.
  pool_deck_context: >-
    Fort Myers pool decks span every era, from 1950s McGregor estates
    to 2020s Gateway and Verandah builds. The McGregor and Whiskey
    Creek pool decks are the most common settlement candidates.
  driveway_context: >-
    Both poured concrete and pavers are common. Older driveways in
    McGregor, Edison Park, and Dean Park show classic differential
    settlement at the apron and along expansion joints.
  zips: ["33901", "33903", "33905", "33907", "33908", "33912", "33913", "33916", "33919", "33966"]
