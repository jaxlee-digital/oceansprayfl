- slug: sanibel
  name: Sanibel
  county: Lee County
  population: "approximately 7,500"
  short: "Sanibel"
  geographic_summary: >-
    Sanibel is a barrier island west of Fort Myers, connected by the
    Sanibel Causeway. The island's character is set by strict
    conservation zoning and the unique east-west orientation that
    catches Gulf shells and storm energy from the south and west.
  seawall_context: >-
    Sanibel seawall inventory is smaller than Cape Coral or Marco
    but disproportionately important. Walls protect bay-side homes
    along the back of the island and on Captiva. Sanibel's
    permitting environment for any marine work is strict, which
    raises the value of restoration over replacement: a poly
    injection job typically falls below the threshold that would
    trigger a full marine permit and review.
  hurricane_context: >-
    Sanibel took a direct hit from Ian. Many bay-side seawalls
    survived structurally but lost significant fill. Some genuinely
    do need replacement; many more can be restored with poly
    injection if assessed honestly. We tell owners both stories.
  warehouse_context: >-
    Sanibel and Captiva don't have traditional industrial
    warehousing, but they have working marina and boat-storage
    facilities, much of it rebuilt or in active reconstruction
    after Hurricane Ian. New slabs poured on disturbed post-Ian
    fill are showing early settlement; older slabs that survived
    the storm are sitting on subgrades that took heavy
    saltwater intrusion.
  pool_deck_context: >-
    Sanibel pool decks are mostly 1980s-2010s construction. Post-Ian
    settling and salt exposure are the dominant failure drivers.
  driveway_context: >-
    Sanibel driveway stock is mostly shell, paver, and stamped
    concrete on a high-water-table sandy substrate.
  zips: ["33957"]
  neighborhoods:
    - "East End"
    - "Mid-Island"
    - "West End"
