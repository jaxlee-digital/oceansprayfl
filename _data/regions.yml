- slug: lehigh-acres
  name: Lehigh Acres
  county: Lee County
  population: "approximately 130,000"
  short: "Lehigh Acres"
  geographic_summary: >-
    Lehigh Acres is a large unincorporated community east of Fort
    Myers, originally platted as a mid-century retirement
    development. It's predominantly inland, with no coastal
    frontage. Growth has shifted Lehigh into a logistics and light
    industrial corridor for the broader Lee County market.
  seawall_context: ""
  hurricane_context: >-
    Lehigh sits inland enough to avoid surge, but Ian's freshwater
    flooding stressed slab-on-grade construction across the area.
    Foundation settlement complaints have ticked up since.
  warehouse_context: >-
    Lehigh Acres is one of the fastest-growing warehouse and light
    industrial markets in Southwest Florida, anchored by the
    Sunshine Boulevard, Lee Boulevard, and SR-82 corridors. Newer
    tilt-up construction sits next to 1990s-2000s metal building
    inventory, much of it on poorly compacted sandy fill. Slab
    settlement around dock thresholds, forklift lanes, and column
    footings is the most common service call.
  pool_deck_context: >-
    Lehigh's pool deck inventory is predominantly 1990s-2010s
    suburban builds. Settlement is driven by the high water table
    and seasonal soil moisture swing.
  driveway_context: >-
    Most Lehigh driveways are poured concrete on sandy fill.
    Differential settlement at the apron and along expansion
    joints is common in the older 1970s-1990s sections.
  zips: ["33936", "33971", "33972", "33973", "33974", "33976"]
