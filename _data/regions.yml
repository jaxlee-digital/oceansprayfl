# Region data for SEO landing pages.
# Each region has slug, name, and contextual content snippets that get
# composed into service+region pages. Keeps the unique-content bar
# easier to clear without writing every page from scratch.

- slug: cape-coral
  name: Cape Coral
  county: Lee County
  population: "approximately 220,000"
  short: "Cape Coral"
  geographic_summary: >-
    Cape Coral is built on a master-planned grid of more than 400
    miles of saltwater and freshwater canals, more navigable
    waterways than any other city in the world. Most homes back
    directly to a canal with a concrete seawall installed in the
    1960s and 1970s.
  seawall_context: >-
    Cape Coral has more residential seawall than any other city in
    Florida. The vast majority were built between 1962 and 1985 of
    pre-cast concrete panels with a poured concrete cap. Sixty years
    of tide cycle, hurricane surge, and groundwater movement have
    pulled fill out from behind those panels. The wall itself is
    usually still structurally sound. The soil column behind it is
    not. That distinction is what determines whether you need
    replacement or restoration.
  hurricane_context: >-
    Hurricane Ian in September 2022 accelerated soil loss behind
    thousands of Cape Coral seawalls. Even walls that visibly
    survived the surge are sitting on compromised fill. Voids that
    formed during the surge can take 12-36 months to surface as
    cap cracks, sinkholes, or settling pavers.
  warehouse_context: >-
    Cape Coral's commercial inventory is mostly small-bay light
    industrial along Pine Island Road and the Veterans Memorial
    corridor, plus a growing logistics presence near the Burnt
    Store junction. Most slabs were poured 1985-2010 on sandy fill
    and are showing trip-hazard settling at dock thresholds and
    forklift lanes.
  pool_deck_context: >-
    Most Cape Coral pool decks were poured at the same time as the
    home, sitting on the same fill that settles toward the canal.
    By year 15-25, the side of the deck closest to the seawall is
    typically 1-3 inches lower than the side against the house.
  driveway_context: >-
    Cape Coral driveways are almost universally poured concrete on
    sandy fill. The high water table and seasonal swing between
    dry-season shrinkage and wet-season swelling drives differential
    settling, especially at the apron and at any expansion joint
    that has lost its seal.
  zips: ["33904", "33909", "33914", "33990", "33991", "33993"]
  neighborhoods:
    - "Yacht Club"
    - "Pelican"
    - "Cape Harbour"
    - "Tarpon Point"
    - "Sandoval"
    - "Burnt Store"
  weight:
    seawall: flagship
    warehouse: medium
    pool_deck: strong
    driveway: strong

- slug: naples
  name: Naples
  county: Collier County
  population: "approximately 19,000 city, 380,000 metro"
  short: "Naples"
  geographic_summary: >-
    Naples sits on the Gulf of Mexico in southern Collier County,
    bordered by Naples Bay, Gordon River, and a network of inland
    canals through Royal Harbor, Aqualane Shores, and Port Royal.
    Coastal homes sit on a mix of coquina, sandy fill, and reclaimed
    bay-bottom.
  seawall_context: >-
    Naples seawall stock is split between older Port Royal and
    Aqualane Shores walls (1950s-1970s, often replaced once already)
    and newer Bay Colony, Pelican Bay, and Royal Harbor walls
    (1980s-2000s). The failure mode is consistent: tidal exchange
    pulls fines through joints and weep holes, voids form behind the
    cap, and the cap eventually cracks or rotates seaward. Naples
    Bay's tidal range is small but constant, which favors slow
    chronic failure over dramatic post-storm collapse.
  hurricane_context: >-
    Hurricane Ian's storm surge pushed up the Gordon River and into
    Naples Bay, undermining seawalls in Old Naples, Royal Harbor, and
    along the Gulf Shore Boulevard corridor. Damage was less visible
    than in Fort Myers Beach but persistent.
  warehouse_context: >-
    Naples has limited heavy industrial inventory. Most commercial
    slab work is in the J&C Boulevard, North Naples industrial pocket,
    and the Airport-Pulling corridor.
  pool_deck_context: >-
    Naples pool decks span every era and price point, from 1960s
    Port Royal travertine over slab to 2020s tile-on-pedestal builds
    in Pelican Bay. The common failure is differential settling at
    the deck-to-coping joint and at the cage footings.
  driveway_context: >-
    Most Naples driveways are paver-set on a sand bed over a
    concrete or stabilized base. Settling shows as bird-bathing,
    rolling pavers, and edge-restraint failure at the apron.
  zips: ["34102", "34103", "34104", "34105", "34108", "34109", "34110", "34112", "34119", "34120"]
  neighborhoods:
    - "Old Naples"
    - "Port Royal"
    - "Aqualane Shores"
    - "Royal Harbor"
    - "Pelican Bay"
    - "Bay Colony"
    - "Pine Ridge"
    - "Vanderbilt Beach"
  weight:
    seawall: strong
    warehouse: weak
    pool_deck: flagship
    driveway: strong

- slug: bonita-springs
  name: Bonita Springs
  county: Lee County
  population: "approximately 60,000"
  short: "Bonita Springs"
  geographic_summary: >-
    Bonita Springs sits between Naples and Fort Myers, straddling
    the Imperial River and Estero Bay back-water system. Coastal
    seawalls line Bonita Beach and the Imperial River; inland
    development sits on sandy Pleistocene fill.
  seawall_context: >-
    Bonita's seawall inventory is concentrated along the Imperial
    River, around Hickory Bay and Big Hickory Pass, and on the
    backside of Bonita Beach. The river walls take more freshwater
    flow stress than typical coastal walls, which speeds up soil
    loss through joints during heavy rain events. Bay walls behave
    more like Estero Bay walls: chronic tidal scour.
  hurricane_context: >-
    Bonita took direct surge from Ian. Imperial River walls are still
    showing post-Ian settling 18+ months later. Bonita Beach walls
    closer to the pass took the brunt of the wave action.
  warehouse_context: >-
    Bonita's commercial slab stock is along Old 41 and Bonita Beach
    Road, with newer light industrial off Bonita Grande Drive.
  pool_deck_context: >-
    Bonita pool decks split between older 1980s-90s Bonita Bay and
    Pelican Landing decks (showing age) and newer Bonita National,
    Esplanade, and Palmira builds.
  driveway_context: >-
    Both poured concrete and paver driveways are common. Settling
    is most visible in older neighborhoods west of 41.
  zips: ["34134", "34135"]
  neighborhoods:
    - "Bonita Beach"
    - "Bonita Bay"
    - "Pelican Landing"
    - "Palmira"
    - "Bonita National"
    - "Imperial River"
  weight:
    seawall: strong
    warehouse: medium
    pool_deck: strong
    driveway: strong

- slug: estero
  name: Estero
  county: Lee County
  population: "approximately 35,000"
  short: "Estero"
  geographic_summary: >-
    Estero sits between Bonita Springs and Fort Myers, with frontage
    on Estero Bay and the Estero River. The Coconut Point commercial
    corridor anchors retail; residential is concentrated in
    master-planned communities west and east of US-41.
  seawall_context: >-
    Estero seawall is mostly along the Estero River and back into
    Estero Bay, with a smaller cluster on the barrier islands. The
    bay is shallow and the river drains a large basin, so wall
    failures here are often driven by heavy freshwater flow events
    pulling fill through joints.
  hurricane_context: >-
    Estero Bay walls absorbed significant Ian surge. Inland walls
    along the Estero River saw less wave action but heavy debris
    impact.
  warehouse_context: >-
    Estero's commercial slab work is mostly retail and office
    around Coconut Point and Miromar. Light industrial is limited
    but growing along Three Oaks Parkway.
  pool_deck_context: >-
    Estero pool decks are predominantly 2000s-2010s construction
    in Pelican Sound, West Bay Club, Grandezza, and similar
    master-planned communities. Common failure is settling at
    cage footings and at the lanai-to-pool-deck transition.
  driveway_context: >-
    Paver driveways dominate. Settling is concentrated at the
    apron and at the garage threshold.
