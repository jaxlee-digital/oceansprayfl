- slug: marco-island
  name: Marco Island
  county: Collier County
  population: "approximately 16,000"
  short: "Marco Island"
  geographic_summary: >-
    Marco Island is a barrier island at the northern edge of the Ten
    Thousand Islands, connected to the mainland by the Jolley Bridge.
    The interior is built on a network of dredged canals lined with
    seawalls; the Gulf side runs uninterrupted beach.
  seawall_context: >-
    Marco's canal seawalls share a similar story to Cape Coral, with
    one important difference: tidal exchange is bigger, exposed fetch
    in the wider canals is longer, and the island is more exposed to
    Gulf weather. Walls here see more daily mechanical work than Cape
    Coral walls, which compresses the failure timeline. Most Marco
    canal walls were installed 1965-1990 and a meaningful share have
    already been replaced once.
  hurricane_context: >-
    Marco took a direct hit from Ian's eyewall. Many seawalls survived
    the wave action but lost significant fill behind them. Owners who
    saw no visible cap damage are now seeing sinkholes and pavers
    settling 18-30 months later.
  warehouse_context: >-
    Marco Island doesn't have traditional industrial warehousing,
    but it has a meaningful concentration of dry-stack marina,
    boat club, and yacht-handling storage facilities. These are
    purpose-built warehouses with very different slab loading
    profiles than a typical distribution center: heavy yacht
    handlers (some 60,000+ lb capacity), concentrated point
    loading from rack-mounted vessels, and narrow drive aisles
    that can't tolerate slab unevenness. Settled slabs in a dry
    stack put the vessels themselves at risk.
  pool_deck_context: >-
    Marco pool decks are predominantly 1970s-2000s construction with
    a high concentration of waterfront cage-and-deck assemblies.
    Settling near the seawall side of the deck is the most common
    complaint.
  driveway_context: >-
    Both pavers and stamped concrete are common. Salt exposure and
    high water table accelerate apron settlement.
  zips: ["34145"]
  neighborhoods:
