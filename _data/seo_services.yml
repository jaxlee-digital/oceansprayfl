  name: Warehouse & Commercial Slab Lifting
  short: "Warehouse slab lifting"
  variant: commercial
  primary_keyword_pattern: "warehouse slab lifting {region}"
  secondary_keywords:
    - "commercial concrete lifting {region}"
    - "warehouse floor leveling {region}"
    - "industrial slab repair {region}"
    - "dock leveler concrete repair {region}"
    - "forklift trip hazard repair {region}"
    - "concrete floor settlement {region}"
    - "polyurethane slab lifting {region}"
    - "warehouse floor repair {region}"
  hero_question_pattern: "Warehouse & Commercial Slab Lifting in {region}, FL"
  meta_title_pattern: "Warehouse & Commercial Slab Lifting in {region}, FL | Ocean Spray Foam"
  meta_description_pattern: >-
    Settled warehouse floors in {region}? Polyurethane injection
    lifts industrial slabs without shutting down operations. No
    demolition, drive forklifts on it the same day. Free site survey.
  intent_lead: >-
    Settled slabs in a working facility cost money two ways: the
    repair, and the downtime. Most facility managers in {region}
    quote out a tear-out and re-pour and immediately stall on the
    operations math: a week of forklift lanes out of service, a
    dock door offline, racking pulled and reset.
  core_pivot: >-
    Polyurethane injection lifts industrial slabs back to grade
    without demolition, without a re-pour, and without shutting
    down the lane. We work in zones around your operation: drill
    small ports, inject resin in stages, lift the slab in real
    time, patch the ports, hand the lane back. Forklifts roll on
    it the same shift.
  diagnostic_replace:
    title: "When replacement is the right call"
    bullets:
      - "Slab is fully fractured into multiple pieces"
      - "Slab thickness or reinforcement is inadequate for the load class"
      - "Subgrade has lost integrity beyond what injection can stabilize"
      - "Facility is being repurposed and the new use requires different specs"
  diagnostic_restore:
    title: "When lifting solves the problem"
    bullets:
      - "Settlement at dock thresholds creating trailer-to-floor mismatch"
      - "Forklift lanes out of plane causing damage to load and equipment"
      - "Trip hazards at expansion joints (OSHA exposure)"
      - "Settling around column footings without structural cracking"
      - "Dock leveler pit out of square"
      - "Slab is intact but the subgrade has settled"
  cost_compare:
    replacement_low: 12
    replacement_high: 25
    restoration_low: 4
    restoration_high: 10
    unit: "square foot of affected area"
    timeline_replacement: "1-3 weeks per zone, lane fully offline"
    timeline_restoration: "hours per zone, lane back in service same shift"
    disruption_replacement: "saw-cut, demolition, debris haul, re-pour, cure window before re-loading"
    disruption_restoration: "small injection ports drilled and patched flush, no demolition, racking can stay in place"
  faq_template:
    - q: "Can you work without shutting down our {region} facility?"
      a: >-
        That's the entire point of polyurethane injection in a
        working facility. We zone the work, scheduling around your
        operation. A typical {region} project closes a single
        forklift lane or a single dock for the duration of the
        injection (usually a few hours), then hands it back. The
        rest of the facility runs normally.
    - q: "What's the load capacity of the cured resin?"
      a: >-
        The high-density structural resins we use for warehouse work
        carry compressive strength ratings supporting 6,000+ psf
        once cured. That's well above standard warehouse floor
        load class requirements. We'll match the resin spec to
        your floor's design load before we inject.
    - q: "Will the patched injection ports affect forklift traffic?"
      a: >-
        No. Ports are 5/8-inch holes drilled through the slab and
        patched flush with a structural compound. The patched
        surface meets or exceeds the surrounding slab's wear and
        load characteristics.
    - q: "Do you carry insurance and bonding for commercial work?"
      a: >-
        Yes. Full general liability, workers compensation, and
        bondable for {region} facility work. We provide insurance
        certificates and bonding documentation up front.
    - q: "How fast can you mobilize for an OSHA-flagged trip hazard?"
      a: >-
        For active trip hazard exposure we mobilize within 48-72
        hours in {region}. Most trip hazards are corrected within
        the same site visit. We can provide written documentation
        of the correction for your safety records.
