# Service definitions for SEO landing pages.
# Used by region+service templates. Each service has shared
# content blocks; region-specific copy lives in regions.yml.

- slug: seawall-stabilization
  name: Seawall Stabilization
  short: "Seawall stabilization"
  variant: residential
  primary_keyword_pattern: "seawall replacement {region}"
  secondary_keywords:
    - "seawall repair {region}"
    - "seawall contractor {region}"
    - "seawall restoration {region}"
    - "failing seawall {region}"
    - "seawall sinking {region}"
    - "sinkhole near seawall {region}"
    - "polyurethane seawall repair {region}"
    - "seawall cost {region}"
  hero_question_pattern: "Seawall Replacement in {region}, FL: Or Restoration?"
  meta_title_pattern: "Seawall Replacement in {region}, FL: Or Is Restoration the Smarter Call? | Ocean Spray Foam"
  meta_description_pattern: >-
    Most failing seawalls in {region} don't need full replacement.
    Polyurethane stabilization fixes the soil failure behind the
    wall at about half the cost. Free assessments. Ocean Spray Foam.
  intent_lead: >-
    If you searched for seawall replacement, you already know your
    wall is in trouble. The question worth asking before you call
    a marine contractor is whether the wall itself is failing,
    or the soil behind it.
  core_pivot: >-
    In Southwest Florida we see roughly 7 out of 10 failing
    seawalls where the concrete panels are still structurally
    intact. The fill behind the wall has eroded out from tidal
    exchange, weep hole flow, and storm surge. The cap cracks,
    pavers settle, sinkholes appear at the lawn, and from the
    surface it looks like the wall is failing. The real failure
    is underground. Stabilizing the soil with polyurethane
    injection solves it without touching the wall.
  diagnostic_replace:
    title: "When replacement is the right call"
    bullets:
      - "Wall is leaning seaward more than a few degrees off vertical"
      - "Multiple panels have separated at the joints"
      - "Cap is structurally fractured, not just hairline cracked"
      - "Rebar is exposed and corroded through"
      - "Wall has rotated or shifted at the toe"
      - "Original construction predates 1970 and the panels are end-of-life"
  diagnostic_restore:
    title: "When restoration solves the problem"
    bullets:
      - "Sinkholes or depressions appearing at the lawn behind the cap"
      - "Pavers, pool deck, or landscape settling toward the water"
      - "Soil washing out through weep holes or wall joints"
      - "Hairline cracking along the cap"
      - "Voids audible when you tap the cap with a steel rod"
      - "Wall is plumb but the ground behind it is dropping"
  cost_compare:
    replacement_low: 700
    replacement_high: 1800
    restoration_low: 200
    restoration_high: 600
    unit: "linear foot"
    timeline_replacement: "2-6 weeks per property, plus permitting"
    timeline_restoration: "1-2 days per property, no marine permit typically required"
    disruption_replacement: "demolition, barge or land-side excavator, removal of pool fence and landscaping"
    disruption_restoration: "truck and small rig in the driveway, no demolition, lawn intact"
  faq_template:
    - q: "How do I know if my seawall in {region} actually needs replacement?"
      a: >-
        We run a free on-site assessment. We sound the cap, look at
        the wall plumb, check the joints, and measure soil voids
        behind the cap with a probe. Most {region} owners who think
        they need replacement need restoration. We tell you straight
        either way: if you actually need replacement, we say so and
        refer you to a marine contractor we trust.
    - q: "Is polyurethane seawall stabilization permanent?"
      a: >-
        The cured resin is chemically inert and structurally stable
        for 50+ years in lab testing. Real-world coastal performance
        in Southwest Florida is consistent with that. The resin
        bonds with the surrounding soil into a solid mass that
        doesn't break down with tide cycles or storm surge.
    - q: "Will I need a marine permit?"
      a: >-
        Almost never. Stabilization is land-side soil work behind
        the wall. We're not entering the water and we're not
        modifying the wall structure, which means we usually fall
        below the threshold that triggers a full marine permit.
        Replacement, by contrast, almost always requires permitting
        and review.
    - q: "Does insurance cover this?"
      a: >-
        Sometimes. Hurricane-related soil loss is occasionally
        covered under flood policies. Long-term tidal erosion
        usually is not. We'll work with your adjuster on
        documentation if there's a covered event in play.
    - q: "How long does a typical {region} seawall job take?"
      a: >-
        Most residential projects are completed in 1-2 days. We
        arrive with a truck-mounted rig, drill small injection
        ports through the cap, inject the resin in stages, and
        leave. Cure is rapid. You're back to using the property
        the same day.
  process:
    - step: "Free on-site assessment"
      detail: "We measure the wall, sound for voids, and tell you straight whether you need restoration or replacement."
    - step: "Engineered injection plan"
      detail: "We map the void pattern and pre-plan injection port spacing and resin volume per linear foot."
    - step: "Day-of injection"
      detail: "Small ports drilled through the cap, resin injected in stages, expansion fills voids and binds soil."
    - step: "Verification and cleanup"
      detail: "We re-sound the cap, confirm no remaining voids, patch the ports flush, and leave the property clean."
  trust_signals:
    - "Certified eco-friendly polyurethane resin, safe for marine ecosystems"
    - "Family-owned, Bonita Springs based, fully insured"
    - "Free assessments across Southwest Florida"
    - "Honest diagnosis: if you need replacement, we tell you"
