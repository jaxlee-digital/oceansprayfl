  faq_template:
    - q: "How long does driveway lifting take in {region}?"
      a: >-
        Most {region} driveways are completed in 2-6 hours. Small
        injection ports are drilled through the slab, resin is
        injected in stages, and the slab rises back to grade in
        real time. You drive on it before we leave.
    - q: "Will I see the injection ports afterward?"
      a: >-
        We patch the ports flush with a color-matched compound. On
        a typical broom-finish driveway, the patches blend into the
        panel within weeks. On exposed aggregate or stamped
        finishes we color-match more aggressively.
    - q: "Will it settle again?"
      a: >-
        The cured resin doesn't compress or wash out. As long as
        we've identified and filled the underlying void, the slab
        stays level. We assess the cause during the quote: if it's
        a one-time fill compaction issue, the lift is permanent.
        If it's ongoing erosion, we address that too.
    - q: "How is this different from mudjacking?"
      a: >-
        Mudjacking pumps a heavy cement slurry under the slab.
        Polyurethane is lighter than the slab itself, sets in
        minutes, and doesn't wash out or re-settle. Mudjacking is
        a 1980s technology; polyurethane has replaced it in nearly
        every modern slab-lifting job.
    - q: "Can you lift a paver driveway?"
      a: >-
        Pavers themselves can be lifted by re-bedding the sand
        course, but if the underlying base or subgrade has settled,
        polyurethane injection under the base course is the
        durable fix.
