title: Ocean Spray Foam
tagline: "Seawall stabilization, Southwest Florida. Polyurethane injection."
description: >-
  Ocean Spray Foam stabilizes failing seawalls using certified, eco-friendly
  polyurethane injection. Serving Bonita Springs, Naples, Estero, Fort Myers,
  Marco Island, and SWFL.
author: Ocean Spray Foam
email: "info@oceansprayfl.com"

# Business contact (used by templates)
business:
  name: "Ocean Spray Foam"
  phone: "(239) 444-7792"
  phone_href: "tel:+12394447792"
  email: "info@oceansprayfl.com"
  email_href: "mailto:info@oceansprayfl.com"
  hq: "Bonita Springs, FL"
  service_area:
    - Bonita Springs
    - Naples
    - Estero
    - Fort Myers
    - Marco Island
    - Lely
    - Everglades City
    - Immokalee
    - LaBelle
    - Felda
  counties:
    - Collier County
    - Lee County
    - Hendry County

social:
  - name: Facebook
    url: "https://www.facebook.com/oceansprayfl/"
    icon: "fa-brands fa-facebook"
  - name: Instagram
    url: "https://www.instagram.com/oceansprayfl/"
    icon: "fa-brands fa-instagram"

# Custom domain attached: oceansprayfl.com (canonical).
# www + the other two domains (oceansprayfoam.us, oceansprayfoamfl.com)
# point at GitHub Pages IPs and auto-301 to oceansprayfl.com.
baseurl: ""
url: "https://oceansprayfl.com"

markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:slug/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-redirect-from

paginate: 10
paginate_path: "/blog/page:num/"

collections:
  services:
    output: true
    permalink: /services/:slug/
  areas:
    output: true
    permalink: /areas/:slug/

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }
  - scope: { path: "", type: "services" }
    values:
      layout: "service"
      # jekyll-seo-tag otherwise emits @type=BlogPosting on collection
      # items, which is wrong for service pages. Force WebPage; real
      # Service schema is emitted by _layouts/service.html.
      seo:
        type: WebPage
  - scope: { path: "", type: "areas" }
    values:
      layout: "region"
      seo:
        type: WebPage

# Site-wide jekyll-seo-tag defaults.
logo: /assets/images/og-default.png
twitter:
  card: summary_large_image

exclude:
  - README.md
  - WORKFLOW.md
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .jekyll-cache/
