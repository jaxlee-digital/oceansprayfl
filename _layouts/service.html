---
layout: default
---
<article class="service">
  <header class="service__header">
    <p class="section-label">Service</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="service__summary">{{ page.summary }}</p>{% endif %}
    <p class="service__actions">
      <a class="btn btn--primary" href="{{ '/contact/' | relative_url }}">Request a Quote</a>
      <a class="btn btn--ghost" href="{{ site.business.phone_href }}">
        <i class="fa-solid fa-phone" aria-hidden="true"></i>
        {{ site.business.phone }}
      </a>
    </p>
  </header>

  {% if page.cover %}
    <figure class="service__cover">
      <img src="{{ page.cover | relative_url }}" alt="{{ page.cover_alt | default: page.title }}">
    </figure>
  {% endif %}

  <div class="service__body">
    {{ content }}
  </div>
</article>
